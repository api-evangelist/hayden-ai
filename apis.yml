aid: hayden-ai
name: Hayden AI
description: 'Hayden AI is a San Francisco based artificial intelligence and spatial
  analytics company that builds a mobile perception platform for public transit agencies
  and city governments. The company mounts a purpose-built AI camera and edge compute
  box on transit buses and other municipal fleet vehicles, then uses computer vision
  to detect bus lane, bus stop, bike lane, double parking and tram blocking violations
  in real time. Detections are reviewed by authorized agency staff in the Hayden AI
  Data Portal, which also carries traffic rule management, city asset monitoring and
  aggregated traffic analytics, and which hands verified evidence off to an agency''s
  existing violations processing system for citation issuance. Hayden AI publishes
  no public developer program, API documentation, SDK or machine-readable API contract;
  the platform is sold and integrated directly with transit agencies and municipalities.'
